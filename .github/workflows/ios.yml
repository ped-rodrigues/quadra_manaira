# Compila o app iOS e roda os testes num Mac do GitHub (no Windows não dá para compilar iOS).
name: iOS
on:
  push:
    paths: ["quadra-manaira-app/ios/**", "quadra-manaira-app/firebase/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    defaults:
      run:
        working-directory: quadra-manaira-app/ios
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen && xcodegen
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Firebase Emulator com dados de exemplo (para o passeio do teste de interface)
        working-directory: quadra-manaira-app/firebase
        run: |
          npm i -g firebase-tools
          (cd functions && npm ci)
          firebase emulators:start --only auth,firestore --project demo-quadra > emulators.log 2>&1 &
          for i in $(seq 90); do curl -s localhost:8080 > /dev/null && curl -s localhost:9099 > /dev/null && break; sleep 2; done
          (cd functions && npm run seed)
      - name: Testes (simulador)
        run: |
          set -o pipefail
          SIM=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if 'iPhone' in x['name']))")
          # Assinatura local ("-"): sem ela o app não usa o keychain e o login do Firebase falha.
          xcodebuild test -project QuadraManaira.xcodeproj -scheme QuadraManaira -destination "id=$SIM" \
            -resultBundlePath TestResults.xcresult CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= | tee build.log | grep -E "error:|warning: .*\.swift|Test Case|TEST|BUILD" || true
          grep -q "TEST SUCCEEDED" build.log
      - name: Fotos das telas
        if: always()
        run: |
          xcrun xcresulttool export attachments --path TestResults.xcresult --output-path telas || true
          xcrun simctl spawn booted log show --last 15m --style compact --predicate 'process == "QuadraManaira"' > telas/app.log 2>&1 || true
          cp ../firebase/emulators.log ../firebase/firestore-debug.log telas/ 2>/dev/null || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telas-ios
          path: quadra-manaira-app/ios/telas
      - name: Build de release (sem assinatura)
        run: |
          set -o pipefail
          xcodebuild build -project QuadraManaira.xcodeproj -scheme QuadraManaira -configuration Release \
            -destination "generic/platform=iOS" CODE_SIGNING_ALLOWED=NO | grep -E "error:|BUILD" 
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: quadra-manaira-app/ios/build.log
