# Gere o projeto do Xcode num Mac com: brew install xcodegen && xcodegen
name: QuadraManaira
options:
  bundleIdPrefix: br.com.quadramanaira
  deploymentTarget:
    iOS: "17.0"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 13.0.1
targets:
  QuadraManaira:
    type: application
    platform: iOS
    sources: [QuadraManaira]
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseMessaging
    entitlements:
      path: QuadraManaira/QuadraManaira.entitlements
      properties:
        aps-environment: development
        # O Firebase Auth guarda o login no keychain; sem esse grupo o simulador recusa (erro -34018).
        keychain-access-groups: ["$(AppIdentifierPrefix)br.com.quadramanaira"]
    info:
      path: QuadraManaira/Info.plist
      properties:
        CFBundleDisplayName: Quadra de Manaíra
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: ""
        UIAppFonts: [BarlowCondensed-SemiBold.ttf]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # Só libera HTTP para a rede local (Firebase Emulator no build de debug).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.quadramanaira
        MARKETING_VERSION: 2.0.0
        CURRENT_PROJECT_VERSION: 5
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  QuadraManairaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [QuadraManairaTests]
    dependencies:
      - target: QuadraManaira
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
  # Passeio com fotos das telas; precisa do Firebase Emulator com `npm run seed` (o CI liga).
  QuadraManairaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [QuadraManairaUITests]
    dependencies:
      - target: QuadraManaira
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  QuadraManaira:
    build:
      targets:
        QuadraManaira: all
    test:
      targets: [QuadraManairaTests, QuadraManairaUITests]
